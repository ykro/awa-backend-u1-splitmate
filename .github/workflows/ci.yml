name: CI SplitMate (retroalimentación)

on:
  # Un cambio que solo toca documentación (ADR, DEPLOYMENT.md, README) no gasta minutos de CI.
  push:
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo cancela la corrida anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1" # la misma versión que el Dockerfile y el calificador
          python-version: "3.13"

      - name: Instalar dependencias exactas del lock
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (formato)
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -v

      - name: Aviso sobre la nota
        if: always()
        run: |
          {
            echo "## Resultado de CI"
            echo ""
            echo "Este resultado es retroalimentación, no tu nota."
            echo "La nota oficial la calcula el calificador del curso con los tests oficiales,"
            echo "tests ocultos del reto, mutantes para tus tests propios y una"
            echo "verificación de integridad (tests oficiales y workflow sin modificar)."
          } >> "$GITHUB_STEP_SUMMARY"
