[project]
name = "splitmate-api"
version = "1.1.0"
description = "SplitMate API - Unidad 1: FastAPI, Pydantic v2, Decimal, inyección de dependencias y pytest"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/ui.py" = ["E501"]
